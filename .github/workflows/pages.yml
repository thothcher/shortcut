name: pages

# Builds the static demo (npm run build:demo) and publishes it on GitHub Pages.
# The real platform needs a server (see docs/DEPLOY.md); this is a click-through copy of it.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # every Monday, so dates such as "access until …" stay current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build:demo
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
