name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Seed demo data and start the server
        run: |
          npm run seed
          node src/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
          curl -sf http://localhost:3000/ | grep -q "Shortcut"
